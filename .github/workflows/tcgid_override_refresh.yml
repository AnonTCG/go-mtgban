name: tcgid_override_refresh

# Regenerate the TCGplayer id-override map and open a PR when it changes.
#
# WHY
# ---
# MTGJSON ships no tcgplayerProductId for part of the catalog — 3,810 of the
# 110,299 entities AnonTCG ingests on 2026-09-24 (build 5.3.0+20260923). Both
# TCGplayer scrapers here gate on that field (index.go enqueues nothing without
# it; tcgplayer.go skips any uuid absent from TcgplayerSkus.json), so those
# cards get no price and no SKU. Scryfall — MTGJSON's source for the field —
# has the same gap, so waiting it out is not a plan.
#
# cmd/tcgid4scryfall already resolves the right product: it walks TCGplayer's
# catalog and matches each product back through mtgmatcher.
# cmd/gen-tcgid-override turns that report into
# mtgmatcher/magic/tcgplayer_id_override_generated.json, which the matcher
# embeds and applies at load.
#
# This workflow runs both and opens a PR. It never pushes to master directly:
# the map changes what every downstream price lands on, so it gets a review.
# Only this repo is written — AnonTCG-ETL keeps its own copy in sync with its
# own workflow, reading the file this PR lands. Neither repo holds a credential
# for the other.
#
# Triggers:
#   - workflow_dispatch (manual)
#   - schedule: biweekly Monday 11:17 UTC (weekly cron + ISO-week parity).
#     TCGplayer's catalog mutates slowly. Off the top of the hour — GitHub
#     silently drops :00 schedules on this account.
#
# Required secrets (already present):
#   TCGPLAYER_PUBLIC_KEY   — client_id from developer.tcgplayer.com
#   TCGPLAYER_PRIVATE_KEY  — client_secret
#
# Cost: public repo, so GitHub-hosted minutes are free. ~1,150 catalog pages,
# roughly 12 minutes at 8 threads.
#
# Local validation:
#   act -n workflow_dispatch -W .github/workflows/tcgid_override_refresh.yml

on:
  workflow_dispatch:
    inputs:
      threads:
        description: 'Parallel catalog workers.'
        required: false
        type: string
        default: '8'

  schedule:
    - cron: '17 11 * * 1'

concurrency:
  group: tcgid-override-refresh
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      THREADS: ${{ inputs.threads || '8' }}
      MAP: mtgmatcher/magic/tcgplayer_id_override_generated.json
      BRANCH: automated/tcgid-override
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Biweekly parity check (skip odd ISO weeks on schedule)
        if: ${{ github.event_name == 'schedule' }}
        run: |
          WEEK=$(date -u +%V)
          if [ "$((10#$WEEK % 2))" != "0" ]; then
            echo "ISO week $WEEK is odd — skipping (biweekly cadence)."
            exit 0
          fi
          echo "ISO week $WEEK is even — proceeding."

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: go.sum

      - name: Verify required secrets
        env:
          TCGPLAYER_PUBLIC_KEY: ${{ secrets.TCGPLAYER_PUBLIC_KEY }}
          TCGPLAYER_PRIVATE_KEY: ${{ secrets.TCGPLAYER_PRIVATE_KEY }}
        run: |
          MISSING=""
          for var in TCGPLAYER_PUBLIC_KEY TCGPLAYER_PRIVATE_KEY; do
            if [ -z "${!var}" ]; then MISSING="$MISSING $var"; fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required secrets:$MISSING"
            exit 1
          fi

      - name: Fetch AllPrintings
        run: |
          curl -sSfL https://mtgjson.com/api/v5/AllPrintings.json.gz -o AllPrintings.json.gz
          gunzip -f AllPrintings.json.gz
          ls -la AllPrintings.json

      - name: Walk the TCGplayer catalog
        env:
          TCGPLAYER_PUBLIC_KEY: ${{ secrets.TCGPLAYER_PUBLIC_KEY }}
          TCGPLAYER_PRIVATE_KEY: ${{ secrets.TCGPLAYER_PRIVATE_KEY }}
          ALLPRINTINGS5_PATH: ${{ github.workspace }}/AllPrintings.json
        run: |
          go run ./cmd/tcgid4scryfall -step 0 -threads "$THREADS" > tcgid4scryfall.csv 2> walk.log
          echo "findings: $(($(wc -l < tcgid4scryfall.csv) - 1))"
          tail -5 walk.log

      # Keep the evidence even when nothing changes: a run that found fewer
      # ids than the last one is the signal that the matcher or the catalog
      # moved, and without the CSV there is nothing to compare against.
      - name: Upload the report
        uses: actions/upload-artifact@v4
        with:
          name: tcgid4scryfall-${{ github.run_id }}
          path: |
            tcgid4scryfall.csv
            walk.log
          retention-days: 90

      - name: Regenerate the map
        env:
          ALLPRINTINGS5_PATH: ${{ github.workspace }}/AllPrintings.json
        run: go run ./cmd/gen-tcgid-override -i tcgid4scryfall.csv -o "$MAP"

      - name: Summarize the change
        id: delta
        run: |
          # git-status, not git-diff: `git diff --quiet` reports NO CHANGE for
          # an untracked path, so a first run (or a map deleted by mistake)
          # would silently commit nothing and report success.
          if [ -z "$(git status --porcelain -- "$MAP")" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Map unchanged — MTGJSON has not moved." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

          # python3, not `grep -c`: grep counts matching LINES, which happens
          # to equal the entry count only while the file stays indented.
          COUNT='import json,sys; print(len(json.load(sys.stdin)["cards"]))'
          BEFORE=$(git show "HEAD:$MAP" 2>/dev/null | python3 -c "$COUNT" 2>/dev/null || echo 0)
          AFTER=$(python3 -c "$COUNT" < "$MAP")
          {
            echo "entries: $BEFORE -> $AFTER"
            echo "findings: $(($(wc -l < tcgid4scryfall.csv) - 1))"
          } | tee delta.txt
          {
            echo "## TCGplayer id override"
            echo
            echo "- entries: \`$BEFORE\` → \`$AFTER\`"
            echo "- report findings: \`$(($(wc -l < tcgid4scryfall.csv) - 1))\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push the branch
        if: steps.delta.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add "$MAP"
          git commit -m "mtgmatcher/magic: refresh the generated TCGplayer id override

          Regenerated by cmd/gen-tcgid-override from a cmd/tcgid4scryfall walk
          of the TCGplayer catalog. $(cat delta.txt | tr '\n' ' ')

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push --force-with-lease origin "$BRANCH"

      # REST rather than the gh CLI or a third-party action: curl and git are
      # the only tools this needs, and the reusable-PR case (branch already
      # open from a prior run) is a single extra call.
      - name: Open or update the PR
        if: steps.delta.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          API="${{ github.api_url }}/repos/${{ github.repository }}"
          EXISTING=$(curl -sSf -H "Authorization: Bearer $GH_TOKEN" \
            "$API/pulls?head=${{ github.repository_owner }}:$BRANCH&state=open" |
            grep -o '"number":[0-9]*' | head -1 | cut -d: -f2)

          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already open for $BRANCH; the push updated it."
            echo "PR: $API/pulls/$EXISTING" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          BODY=$(printf 'Regenerated by `cmd/gen-tcgid-override` from a `cmd/tcgid4scryfall` walk of the TCGplayer catalog.\n\n```\n%s\n```\n\nThese are TCGplayer product ids MTGJSON does not publish. Without them both TCGplayer scrapers skip the card, which shows up downstream as $0.00 rows with a blank TCGplayer Id.\n\nThe CSV the map was built from is attached to [run %s](%s/%s/actions/runs/%s).\n\n**After merging**, AnonTCG-ETL needs the same file — its `tcgid_override_sync` workflow picks it up from this branch once merged.\n' \
            "$(cat delta.txt)" "${{ github.run_id }}" "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}")

          TITLE="Refresh the generated TCGplayer id override" \
          HEAD_REF="$BRANCH" BASE_REF="${{ github.event.repository.default_branch }}" \
          PR_BODY="$BODY" \
          python3 -c 'import json,os; print(json.dumps({
              "title": os.environ["TITLE"],
              "head":  os.environ["HEAD_REF"],
              "base":  os.environ["BASE_REF"],
              "body":  os.environ["PR_BODY"],
          }))' > pr.json

          curl -sSf -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$API/pulls" -d @pr.json | grep -o '"html_url":"[^"]*"' | head -1 |
            tee -a "$GITHUB_STEP_SUMMARY"
