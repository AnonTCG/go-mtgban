name: Download and cache a file

# AnonTCG fork: this workflow downloads + caches a file (typically the
# MTGJSON AllPrintings.json datastore). Upstream's "Upload to B2" and "Ping
# mtgban server" steps were removed — we don't push to mtgban's Backblaze
# datastore and don't ping mtgban.com endpoints. The downstream `run-bantool`
# job consumes the cached file directly.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Where to download from"
        required: true
        type: string
      path:
        description: "Where to download to"
        required: true
        type: string
        default: "datastore/"
      game:
        description: "Logical game label (kept for parity with upstream callers)"
        type: string

  workflow_call:
    inputs:
      url:
        required: true
        type: string
      path:
        required: true
        type: string
      game:
        type: string
    outputs:
      key:
        description: "Key of the cache to retrieve"
        value: ${{ jobs.cache-file.outputs.key }}
      filepath:
        description: "Where the file will be availble at"
        value: ${{ jobs.cache-file.outputs.filepath }}

permissions:
  contents: read

jobs:
  cache-file:
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.get_etag.outputs.key }}
      filepath: ${{ steps.get_etag.outputs.filepath }}
    steps:
      - name: Fetch file checksum
        id: get_etag
        run: |
          etag=$(curl -sI "${{ inputs.url }}" | grep -i etag | tr -d '\r"' | cut -f 2 -d " ")
          base=$(basename "${{ inputs.url }}" | cut -d? -f1)
          key=$base-$etag
          filepath=${{ inputs.path }}$base
          echo "key=$key" >> $GITHUB_OUTPUT
          echo "filepath=$filepath" >> $GITHUB_OUTPUT

      - name: Cache path
        id: cache_file
        uses: actions/cache@v5
        with:
          path: ${{ inputs.path }}
          key: ${{ steps.get_etag.outputs.key }}

      - if: steps.cache_file.outputs.cache-hit != 'true'
        name: Download file
        run: |
          mkdir -p "${{ inputs.path }}"
          curl -L "${{ inputs.url }}" -o "${{ steps.get_etag.outputs.filepath }}"
