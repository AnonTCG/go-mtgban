name: riftbound / miniaturemarket_sealed

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [riftbound-miniaturemarket_sealed, riftbound-all]
  schedule:
    - cron: "9 0,12 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-miniaturemarket
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      store: miniaturemarket_sealed
      game: "riftbound"
      affiliate: ${{ vars.MM_PARTNER }}
      datastore-filepath: b2://mtgban-datastore/riftbound/riftbound.json.xz
    secrets: inherit
