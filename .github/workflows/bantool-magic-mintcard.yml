name: magic / mintcard

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [magic-mintcard, magic-all]
  schedule:
    - cron: "37 19 * * *"

permissions:
  contents: read

jobs:
  cache-datastore:
    uses: ./.github/workflows/cache-file.yml
    with:
      url: ${{ vars.DATASTORE_MAGIC }}
      path: "datastore/"
      game: "magic"
    secrets: inherit

  deploy:
    name: ${{ github.workflow }}
    needs: [cache-datastore]
    uses: ./.github/workflows/run-bantool.yml
    with:
      store: mintcard
      game: "magic"
      affiliate: ${{ vars.MINT_PARTNER }}
      datastore-filepath: ${{ needs.cache-datastore.outputs.filepath }}
      datastore-cache-key: ${{ needs.cache-datastore.outputs.key }}
    secrets: inherit
