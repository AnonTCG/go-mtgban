name: lorcana / miniaturemarket_sealed

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [lorcana-miniaturemarket_sealed, lorcana-all]
  schedule:
    - cron: "37 1,13 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-miniaturemarket
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      store: miniaturemarket_sealed
      game: "lorcana"
      affiliate: ${{ vars.MM_PARTNER }}
      datastore-filepath: b2://mtgban-datastore/lorcana/lorcana.json.xz
    secrets: inherit
