name: Run CI

on:
  workflow_dispatch: {}
  # A branch with a pull request open answers for it there, so pushing to one
  # would otherwise run the whole suite twice over the same commit.
  push:
    branches:
      - master
  pull_request: {}
  schedule:
    - cron: "0 0 * * *"

# One run per branch and trigger: a push that supersedes another stops it
# rather than racing it for the runners. The trigger is part of the key
# because the nightly schedule and a push to master would otherwise share
# it, and whichever came second cancelled the first - which mtgban-ci
# counts as a broken run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Formatting, vet and lint read no datastore, so they run on their own and
  # report in seconds rather than behind the cache jobs.
  style:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install golang
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-ed:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Lint
        run: |
          go run github.com/mgechev/revive@v1.13.0 \
            -set_exit_status -config .revive.toml ./...

      # revive reads the syntax tree; staticcheck follows the values through
      # it, which is how the errors that were assigned and then overwritten
      # were found. Pinned, since a new release finding new things would fail
      # a build that changed nothing.
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...

      # The standard library ships with the toolchain, which Dependabot's
      # go.mod updates do not cover. Not pinned: the verdict follows the
      # vulnerability database, which moves whichever release reads it.
      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Build
        run: go build ./...

      # A test either does not read a datastore or asks for one and skips
      # where the run carries none. With nothing configured the whole tree
      # has to come back green, so a test that reads one without asking
      # fails here - rather than passing because whichever job it landed in
      # happened to load a datastore before it ran.
      - name: Tests skip rather than fail without a datastore
        # Keep the race detector on: the scrapers fan out over goroutines
        # that share one backend, and the fixture tests are where a data
        # race on it shows without a datastore.
        run: go test -race ./...

  cache-datastore:
    uses: ./.github/workflows/cache-file.yml
    with:
      url: ${{ vars.DATASTORE_MAGIC }}
      path: "datastore/"
      game: "magic"
    secrets: inherit

  cache-lorcana:
    uses: ./.github/workflows/cache-b2.yml
    with:
      uri: "b2://mtgban-datastore/lorcana/lorcana.json.xz"
    secrets: inherit

  cache-riftbound:
    uses: ./.github/workflows/cache-b2.yml
    with:
      uri: "b2://mtgban-datastore/riftbound/riftbound.json.xz"
    secrets: inherit

  cache-gundam:
    uses: ./.github/workflows/cache-b2.yml
    with:
      uri: "b2://mtgban-datastore/gundam/gundam.json.xz"
    secrets: inherit

  cache-palworld:
    uses: ./.github/workflows/cache-b2.yml
    with:
      uri: "b2://mtgban-datastore/palworld/palworld.json.xz"
    secrets: inherit

  cache-onepiece:
    uses: ./.github/workflows/cache-b2.yml
    with:
      uri: "b2://mtgban-datastore/onepiece/onepiece.json.xz"
    secrets: inherit

  cache-yugioh:
    uses: ./.github/workflows/cache-b2.yml
    with:
      uri: "b2://mtgban-datastore/yugioh/yugioh.json.xz"
    secrets: inherit

  cache-fleshandblood:
    uses: ./.github/workflows/cache-b2.yml
    with:
      uri: "b2://mtgban-datastore/fleshandblood/fleshandblood.json.xz"
    secrets: inherit

  cache-pokemon:
    uses: ./.github/workflows/cache-b2.yml
    with:
      uri: "b2://mtgban-datastore/pokemon/pokemon.json.xz"
    secrets: inherit

  # Every game is tested on its own, so one game's datastore drifting can no
  # longer hide the others: a red check names the game that broke. Magic
  # carries the whole tree because the scrapers and the matcher core read
  # AllPrintings and nothing else, and the other games' suites skip
  # themselves when their variable is unset.
  test-magic:
    needs: cache-datastore
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install golang
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Cache Magic Datastore
        uses: actions/cache/restore@v6
        with:
          path: "datastore/"
          key: ${{ needs.cache-datastore.outputs.key }}
          fail-on-cache-miss: true

      # A red run states exactly which datastore bytes it tested against,
      # diffable against the bucket or a local build; a golden failure is
      # diagnosed by fingerprint instead of by guessing which version of a
      # datastore the run happened to hold.
      - name: Datastore fingerprint
        run: |
          sha256sum ${{ needs.cache-datastore.outputs.filepath }}
          ls -l datastore/

      - name: Test
        env:
          ALLPRINTINGS5_PATH: "${{ github.workspace }}/datastore/allprintings5.json"
        run: |
          xz -dc ${{ needs.cache-datastore.outputs.filepath }} > datastore/allprintings5.json
          go test ./... -v

  # The scrapers fan out over goroutines sharing one backend, and only a run
  # holding a datastore reaches those paths under the race detector. With
  # AllPrintings loaded it is over ten times slower, so it runs nightly. It
  # stays out of mtgban-ci's needs: a push skips it, and mtgban-ci fails a
  # skipped need.
  race-magic:
    needs: cache-datastore
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install golang
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Cache Magic Datastore
        uses: actions/cache/restore@v6
        with:
          path: "datastore/"
          key: ${{ needs.cache-datastore.outputs.key }}
          fail-on-cache-miss: true

      - name: Datastore fingerprint
        run: |
          sha256sum ${{ needs.cache-datastore.outputs.filepath }}
          ls -l datastore/

      # One package at a time: a test binary holding AllPrintings under -race
      # takes 8 to 11GB, and the runner has 16GB. The default 10m -timeout is
      # shorter than coolstuffinc, which parses the datastore once per test.
      - name: Test with the race detector
        env:
          ALLPRINTINGS5_PATH: "${{ github.workspace }}/datastore/allprintings5.json"
        run: |
          set -o pipefail
          xz -dc ${{ needs.cache-datastore.outputs.filepath }} > datastore/allprintings5.json
          go test -race -p 1 -timeout 2h -coverprofile=coverage.out ./... | tee race.out

      # A package's figure counts only what its own tests reach.
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('coverage.out') != '' }}
        run: |
          {
            echo "| Package | Coverage |"
            echo "|---|---|"
            awk -F '\t' '/\tcoverage: / {
              sub(/^github\.com\/mtgban\/go-mtgban\//, "", $2)
              sub(/^coverage: /, "", $NF)
              sub(/ of statements$/, "", $NF)
              print "| " $2 " | " $NF " |"
            }' race.out
            echo
            go tool cover -func=coverage.out | tail -n 1 | awk '{print "Total: " $NF}'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage profile
        if: ${{ !cancelled() && hashFiles('coverage.out') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  # The scraper packages listed beside a game's matcher are the ones whose
  # catalogs span several games and keep every game's tests together: only
  # the job holding that game's datastore can run them, and the Magic job
  # that compiles them holds AllPrintings and nothing else, so without this
  # they skipped everywhere and reported green.
  test-lorcana:
    needs: cache-lorcana
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install golang
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Cache Lorcana Datastore
        uses: actions/cache/restore@v6
        with:
          path: "datastore/"
          key: ${{ needs.cache-lorcana.outputs.key }}
          fail-on-cache-miss: true

      # A red run states exactly which datastore bytes it tested against,
      # diffable against the bucket or a local build; a golden failure is
      # diagnosed by fingerprint instead of by guessing which version of a
      # datastore the run happened to hold.
      - name: Datastore fingerprint
        run: |
          sha256sum ${{ needs.cache-lorcana.outputs.filepath }}
          ls -l datastore/

      - name: Test
        env:
          LORCANA_PATH: "${{ github.workspace }}/${{ needs.cache-lorcana.outputs.filepath }}"
        run: |
          go test ./matcher/lorcana/... ./starcitygames/... ./miniaturemarket/... ./coolstuffinc/... ./gamenerdz/... ./internal/vocabulary/... -v

  test-riftbound:
    needs: cache-riftbound
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install golang
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Cache Riftbound Datastore
        uses: actions/cache/restore@v6
        with:
          path: "datastore/"
          key: ${{ needs.cache-riftbound.outputs.key }}
          fail-on-cache-miss: true

      # A red run states exactly which datastore bytes it tested against,
      # diffable against the bucket or a local build; a golden failure is
      # diagnosed by fingerprint instead of by guessing which version of a
      # datastore the run happened to hold.
      - name: Datastore fingerprint
        run: |
          sha256sum ${{ needs.cache-riftbound.outputs.filepath }}
          ls -l datastore/

      - name: Test
        env:
          RIFTBOUND_PATH: "${{ github.workspace }}/${{ needs.cache-riftbound.outputs.filepath }}"
        run: |
          go test ./matcher/riftbound/... ./vegassingles/... ./starcitygames/... ./coolstuffinc/... ./cardmarket/... ./internal/vocabulary/... -v

  test-gundam:
    needs: cache-gundam
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install golang
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Cache Gundam Datastore
        uses: actions/cache/restore@v6
        with:
          path: "datastore/"
          key: ${{ needs.cache-gundam.outputs.key }}
          fail-on-cache-miss: true

      # A red run states exactly which datastore bytes it tested against,
      # diffable against the bucket or a local build; a golden failure is
      # diagnosed by fingerprint instead of by guessing which version of a
      # datastore the run happened to hold.
      - name: Datastore fingerprint
        run: |
          sha256sum ${{ needs.cache-gundam.outputs.filepath }}
          ls -l datastore/

      - name: Test
        env:
          GUNDAM_PATH: "${{ github.workspace }}/${{ needs.cache-gundam.outputs.filepath }}"
        run: |
          go test ./matcher/gundam/... ./cardtrader/... ./miniaturemarket/... ./coolstuffinc/... ./internal/vocabulary/... -v

  test-palworld:
    needs: cache-palworld
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install golang
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Cache Palworld Datastore
        uses: actions/cache/restore@v6
        with:
          path: "datastore/"
          key: ${{ needs.cache-palworld.outputs.key }}
          fail-on-cache-miss: true

      # A red run states exactly which datastore bytes it tested against,
      # diffable against the bucket or a local build; a golden failure is
      # diagnosed by fingerprint instead of by guessing which version of a
      # datastore the run happened to hold.
      - name: Datastore fingerprint
        run: |
          sha256sum ${{ needs.cache-palworld.outputs.filepath }}
          ls -l datastore/

      - name: Test
        env:
          PALWORLD_PATH: "${{ github.workspace }}/${{ needs.cache-palworld.outputs.filepath }}"
        run: |
          go test ./matcher/palworld/... ./coolstuffinc/... ./internal/vocabulary/... -v

  test-onepiece:
    needs: cache-onepiece
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install golang
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Cache One Piece Datastore
        uses: actions/cache/restore@v6
        with:
          path: "datastore/"
          key: ${{ needs.cache-onepiece.outputs.key }}
          fail-on-cache-miss: true

      # A red run states exactly which datastore bytes it tested against,
      # diffable against the bucket or a local build; a golden failure is
      # diagnosed by fingerprint instead of by guessing which version of a
      # datastore the run happened to hold.
      - name: Datastore fingerprint
        run: |
          sha256sum ${{ needs.cache-onepiece.outputs.filepath }}
          ls -l datastore/

      - name: Test
        env:
          ONEPIECE_PATH: "${{ github.workspace }}/${{ needs.cache-onepiece.outputs.filepath }}"
        run: |
          go test ./matcher/onepiece/... ./vegassingles/... ./coolstuffinc/... ./cardgamecorner/... ./internal/vocabulary/... -v

  test-yugioh:
    needs: cache-yugioh
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install golang
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Cache Yu-Gi-Oh Datastore
        uses: actions/cache/restore@v6
        with:
          path: "datastore/"
          key: ${{ needs.cache-yugioh.outputs.key }}
          fail-on-cache-miss: true

      # A red run states exactly which datastore bytes it tested against,
      # diffable against the bucket or a local build; a golden failure is
      # diagnosed by fingerprint instead of by guessing which version of a
      # datastore the run happened to hold.
      - name: Datastore fingerprint
        run: |
          sha256sum ${{ needs.cache-yugioh.outputs.filepath }}
          ls -l datastore/

      - name: Test
        env:
          YUGIOH_PATH: "${{ github.workspace }}/${{ needs.cache-yugioh.outputs.filepath }}"
        run: |
          go test ./matcher/yugioh/... ./coolstuffinc/... ./cardmarket/... ./cardgamecorner/... ./internal/vocabulary/... -v

  test-fleshandblood:
    needs: cache-fleshandblood
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install golang
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Cache Flesh and Blood Datastore
        uses: actions/cache/restore@v6
        with:
          path: "datastore/"
          key: ${{ needs.cache-fleshandblood.outputs.key }}
          fail-on-cache-miss: true

      # A red run states exactly which datastore bytes it tested against,
      # diffable against the bucket or a local build; a golden failure is
      # diagnosed by fingerprint instead of by guessing which version of a
      # datastore the run happened to hold.
      - name: Datastore fingerprint
        run: |
          sha256sum ${{ needs.cache-fleshandblood.outputs.filepath }}
          ls -l datastore/

      - name: Test
        env:
          FLESHANDBLOOD_PATH: "${{ github.workspace }}/${{ needs.cache-fleshandblood.outputs.filepath }}"
        run: |
          go test ./matcher/fleshandblood/... ./starcitygames/... ./miniaturemarket/... ./internal/vocabulary/... -v

  test-pokemon:
    needs: cache-pokemon
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install golang
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Cache Pokemon Datastore
        uses: actions/cache/restore@v6
        with:
          path: "datastore/"
          key: ${{ needs.cache-pokemon.outputs.key }}
          fail-on-cache-miss: true

      # A red run states exactly which datastore bytes it tested against,
      # diffable against the bucket or a local build; a golden failure is
      # diagnosed by fingerprint instead of by guessing which version of a
      # datastore the run happened to hold.
      - name: Datastore fingerprint
        run: |
          sha256sum ${{ needs.cache-pokemon.outputs.filepath }}
          ls -l datastore/

      - name: Test
        env:
          POKEMON_PATH: "${{ github.workspace }}/${{ needs.cache-pokemon.outputs.filepath }}"
        run: |
          go test ./matcher/pokemon/... ./vegassingles/... ./coolstuffinc/... ./cardmarket/... ./cardgamecorner/... ./internal/vocabulary/... -v

  # The one check master's branch protection requires, kept as a name rather
  # than as work: it fans the per-game jobs back into a single verdict. It has
  # to run even when a dependency failed and re-read the results by hand,
  # because a required check that is merely skipped counts as passed and would
  # wave a broken tree through.
  mtgban-ci:
    needs: [style, test-magic, test-lorcana, test-riftbound, test-onepiece,
            test-yugioh, test-fleshandblood, test-pokemon, test-gundam,
            test-palworld]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Verify every suite passed
        env:
          RESULTS: "${{ join(needs.*.result, ' ') }}"
          # A suite that never ran is not a suite that passed. A cache job
          # failing - a bucket outage, a rotated key, a renamed object -
          # skips the game that needs it, and a skipped result would read as
          # a green one and wave that game's tree through untested.
          BROKEN: "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}"
        run: |
          echo "$RESULTS"
          if [ "$BROKEN" = "true" ]; then
            exit 1
          fi
