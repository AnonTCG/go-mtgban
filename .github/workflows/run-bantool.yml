name: Run bantool

# AnonTCG fork — bantool runner.
#
# Required GitHub Actions configuration (Settings → Secrets and variables → Actions):
#
#   --- repository variables ---
#   ANONTCG_OUTPUT_BASE       e.g. `s3://anontcg-bantool` — base path bantool writes NDJSON under.
#                             Bantool appends `/<game>/<target>` to this.
#                             For local file output during testing: `file:///tmp/bantool`.
#   MAX_CONCURRENCY           per-scraper goroutine cap (default 8 if unset)
#
#   Partner / affiliate IDs (set the ones you have; missing ones become empty strings):
#   CK_PARTNER, CSI_PARTNER, CT_PARTNER, MINT_PARTNER, MP_PARTNER, SCG_PARTNER, TCG_PARTNER
#
#   --- repository secrets ---
#   R2 credentials (S3-compatible — bantool reads these as standard AWS_* env names):
#   ANONTCG_R2_KEY_ID         Cloudflare R2 access key id
#   ANONTCG_R2_SECRET         Cloudflare R2 secret access key
#   ANONTCG_R2_ENDPOINT       Cloudflare R2 endpoint URL (e.g. https://<acct>.r2.cloudflarestorage.com)
#
#   Scraper credentials (each scraper hits a different vendor's API):
#   CARDTRADER_TOKEN_BEARER, MKM_APP_SECRET, MKM_APP_TOKEN,
#   SCG_BEARER, SCG_GUID,
#   TCGPLAYER_AUTH, TCGPLAYER_PRIVATE_KEY, TCGPLAYER_PUBLIC_KEY
#
# Removed from upstream (intentionally):
#   - B2_APP_KEY / B2_KEY_ID / B2_KEY_ID_DATASTORE / B2_APP_KEY_DATASTORE
#     (we use Cloudflare R2, not Backblaze B2)
#   - BAN_API_KEY / BAN_SECRET (the upstream "ping mtgban.com/api/load/<target>"
#     loop has no analog on our infrastructure)
#   - The "Ping server" step (same reason)
#
# Added vs upstream:
#   - AllPrintings validation step (fail fast on empty/invalid datastore)

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      game:
        required: true
        type: string
      datastore-filepath:
        required: true
        type: string
      datastore-cache-key:
        required: true
        type: string
      skus-filepath:
        type: string
      skus-cache-key:
        type: string

permissions:
  contents: read

jobs:
  run-bantool:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check IP
        run: echo "Runner IP - $(curl https://api.ipify.org 2> /dev/null)"

      - name: Install golang
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Show Go version
        run: go version

      - name: Cache Datastore
        uses: actions/cache/restore@v5
        with:
          path: "datastore/"
          key: ${{ inputs.datastore-cache-key }}
          fail-on-cache-miss: true

      # Fail fast if the AllPrintings datastore is empty or invalid. Without
      # this, bantool reports a confusing downstream LorcanaJSON error that
      # hides the root cause.
      - name: Validate datastore (AllPrintings)
        if: ${{ inputs.datastore-filepath != '' }}
        run: |
          FP="${{ inputs.datastore-filepath }}"
          if [[ -f "$FP" ]]; then
            if [[ "$FP" == *AllPrintings* ]]; then
              COUNT=$(jq -r '.data | keys | length' "$FP" 2>/dev/null || echo "0")
              if [[ "$COUNT" =~ ^[0-9]+$ ]] && [[ "$COUNT" -gt 0 ]]; then
                echo "Datastore valid: $COUNT sets in $FP"
              else
                echo "::error::AllPrintings datastore has no sets (data empty or invalid JSON). File: $FP"
                exit 1
              fi
            fi
          else
            echo "::error::Datastore file not found: $FP"
            exit 1
          fi

      - if: ${{ inputs.skus-cache-key }}
        name: Cache Skus
        uses: actions/cache/restore@v5
        with:
          path: "datastore/"
          key: ${{ inputs.skus-cache-key }}
          fail-on-cache-miss: true

      - name: Build bantool
        run: |
          cd cmd/bantool
          go install

      - name: Fetch SCG sell-list bearer
        if: ${{ inputs.target == 'starcitygames' || inputs.target == 'starcitygames_sealed' }}
        run: |
          APP_URL="$(
            curl -fsSL -A "Mozilla/5.0" https://sellyourcards.starcitygames.com/mtg |
            python3 -c 'import re,sys,urllib.parse; html=sys.stdin.read(); m=re.search(r"<script[^>]+src=\"([^\"]*/js/app\.js\?id=[^\"]+)\"", html); assert m, "app.js not found"; print(urllib.parse.urljoin("https://sellyourcards.starcitygames.com/mtg", m.group(1)))'
          )"
          SCG_BEARER="$(curl -fsSL -A "Mozilla/5.0" "$APP_URL" | python3 -c 'import re,sys; js=sys.stdin.read(); k=re.search(r"apiKey:\"([a-f0-9]{64})\"", js); assert k, "apiKey not found"; print(k.group(1))')"
          echo "::add-mask::$SCG_BEARER"
          echo "SCG_BEARER=$SCG_BEARER" >> "$GITHUB_ENV"
          echo "SCG_GUID=unused-for-buylist" >> "$GITHUB_ENV"
          echo "SCG_BUYLIST_ONLY=true" >> "$GITHUB_ENV"

      - name: Run bantool
        id: run_bantool
        env:
          # Bucket destination (AnonTCG variable, not the legacy OUTPUT_BASE)
          ANONTCG_OUTPUT_BASE: "${{ vars.ANONTCG_OUTPUT_BASE }}"

          # Partner / affiliate IDs (vendor-specific, kept as-is)
          CK_PARTNER: "${{ vars.CK_PARTNER }}"
          CSI_PARTNER: "${{ vars.CSI_PARTNER }}"
          CT_PARTNER: "${{ vars.CT_PARTNER }}"
          MINT_PARTNER: "${{ vars.MINT_PARTNER }}"
          MP_PARTNER: "${{ vars.MP_PARTNER }}"
          SCG_PARTNER: "${{ vars.SCG_PARTNER }}"
          TCG_PARTNER: "${{ vars.TCG_PARTNER }}"
          MAX_CONCURRENCY: "${{ vars.MAX_CONCURRENCY }}"

          MTGJSON_TCGSKU_PATH: "${{ inputs.skus-filepath }}"

          # R2 credentials — Cloudflare R2 is S3-compatible, so bantool's
          # AWS-SDK-based S3 writer authenticates via standard AWS_* env names.
          # We map our AnonTCG-named secrets onto the standard names here.
          # Key/secret are org-level SECRETS; endpoint is an org-level VARIABLE
          # (the account-id URL isn't actually sensitive — visible in any R2
          # request — and being a var lets it be shared without re-pasting).
          AWS_ACCESS_KEY_ID: "${{ secrets.ANONTCG_R2_KEY_ID }}"
          AWS_SECRET_ACCESS_KEY: "${{ secrets.ANONTCG_R2_SECRET }}"
          AWS_ENDPOINT: "${{ vars.ANONTCG_R2_ENDPOINT }}"

          # Scraper credentials (vendor APIs)
          CARDTRADER_TOKEN_BEARER: "${{ secrets.CARDTRADER_TOKEN_BEARER }}"
          MKM_APP_SECRET: "${{ secrets.MKM_APP_SECRET }}"
          MKM_APP_TOKEN: "${{ secrets.MKM_APP_TOKEN }}"
          TCGPLAYER_AUTH: "${{ secrets.TCGPLAYER_AUTH }}"
          TCGPLAYER_PRIVATE_KEY: "${{ secrets.TCGPLAYER_PRIVATE_KEY }}"
          TCGPLAYER_PUBLIC_KEY: "${{ secrets.TCGPLAYER_PUBLIC_KEY }}"
        run: |
          set +e
          MODE_ARGS=("-${{ inputs.target }}")
          if [[ "${{ inputs.target }}" == "starcitygames" ]]; then
              MODE_ARGS=("-vendors" "starcitygames")
          elif [[ "${{ inputs.target }}" == "starcitygames_sealed" ]]; then
              MODE_ARGS=("-vendors" "starcitygames_sealed")
          fi

          bantool -datastore ${{ inputs.datastore-filepath }} \
                  -output-path "${ANONTCG_OUTPUT_BASE}/${{ inputs.game }}/${{ inputs.target }}" \
                  -format ndjson \
                  "${MODE_ARGS[@]}"
          EXIT=$?
          echo "exit_code=$EXIT" >> "$GITHUB_OUTPUT"
          set -e

          # delay failure so we can still load what succeeded
          if [[ $EXIT -eq 2 ]]; then
              exit 0
          fi
          exit $EXIT

      - name: Check bantool status
        if: ${{ false }}
        run: |
          echo "bantool returned exit code 2"
          exit 1

