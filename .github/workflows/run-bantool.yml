name: Run bantool

on:
  workflow_call:
    inputs:
      store:
        required: true
        type: string
      affiliate:
        description: Partner code for this scraper's target (empty = none)
        required: false
        type: string
        default: ""
      game:
        required: true
        type: string
      datastore-filepath:
        required: true
        type: string
      # Left empty when datastore-filepath is remote (a b2:// path bantool
      # reads directly), which needs no cached download.
      datastore-cache-key:
        required: false
        type: string
      # The Cardmarket id map the index prices from, as go-cardmarket's
      # catalog dump publishes it.
      cardmarket-catalog-filepath:
        type: string
      # A JSON array, same shape a job's own runs-on takes - so a caller
      # that needs a self-hosted runner (a catalog too large to finish on
      # ubuntu-latest's job ceiling) can name its label without every other
      # caller needing to know self-hosted runners exist at all.
      runs-on:
        required: false
        type: string
        default: '["ubuntu-latest"]'

permissions:
  contents: read

jobs:
  run-bantool:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    # Self-hosted runners still get GitHub's 360m default job timeout;
    # bantool uploads its dump once at the end, so a kill loses the whole
    # run, not just its tail.
    timeout-minutes: 1440

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check IP
        run: echo "Runner IP - $(curl https://api.ipify.org 2> /dev/null)"

      - name: Install golang
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # Self-hosted's Go module cache is already warm and read-only on
          # disk from the previous job, so restoring setup-go's own cache
          # on top of it fails to overwrite anything there.
          cache: ${{ !contains(fromJSON(inputs.runs-on), 'self-hosted') }}

      - name: Show Go version
        run: go version

      - if: ${{ inputs.datastore-cache-key }}
        name: Cache Datastore
        uses: actions/cache/restore@v6
        with:
          path: "datastore/"
          key: ${{ inputs.datastore-cache-key }}
          fail-on-cache-miss: true

      - name: Build bantool
        run: |
          cd cmd/bantool
          go install

      - name: Run bantool
        id: run_bantool
        env:
          AFFILIATE: "${{ inputs.affiliate }}"
          MAX_CONCURRENCY: "${{ vars.MAX_CONCURRENCY }}"

          CARDMARKET_CATALOG_PATH: "${{ inputs.cardmarket-catalog-filepath }}"
          # The catalog dump is published beside every game's datastore, on
          # the same schedule, and names the product each sku belongs to.
          TCGPLAYER_CATALOG_PATH: "b2://mtgban-datastore/${{ inputs.game }}/tcgplayer-catalog.json.xz"

          B2_APP_KEY: "${{ secrets.B2_APP_KEY }}"
          B2_KEY_ID: "${{ secrets.B2_KEY_ID }}"
          # Reading a datastore straight from its bucket (b2:// filepath)
          # needs the datastore key; the output key above cannot read it.
          B2_APP_KEY_DATASTORE: "${{ secrets.B2_APPLICATION_KEY_DATASTORE }}"
          B2_KEY_ID_DATASTORE: "${{ secrets.B2_APPLICATION_KEY_ID_DATASTORE }}"
          BAN_API_KEY: "${{ secrets.BAN_API_KEY }}"
          CARDTRADER_TOKEN_BEARER: "${{ secrets.CARDTRADER_TOKEN_BEARER }}"
          MKM_APP_SECRET: "${{ secrets.MKM_APP_SECRET }}"
          MKM_APP_TOKEN: "${{ secrets.MKM_APP_TOKEN }}"
          SCG_API_KEY: "${{ secrets.SCG_API_KEY }}"
          TCGPLAYER_AUTH: "${{ secrets.TCGPLAYER_AUTH }}"
          TCGPLAYER_PRIVATE_KEY: "${{ secrets.TCGPLAYER_PRIVATE_KEY }}"
          TCGPLAYER_PUBLIC_KEY: "${{ secrets.TCGPLAYER_PUBLIC_KEY }}"
        run: |
          set +e
          bantool -game ${{ inputs.game }} \
                  -store ${{ inputs.store }} \
                  -datastore ${{ inputs.datastore-filepath }} \
                  -output-path b2://mtgban-dumps/${{ inputs.game }}/${{ inputs.store }} \
                  -format json.xz
          EXIT=$?
          echo "exit_code=$EXIT" >> "$GITHUB_OUTPUT"
          set -e

          # delay failure so we can still load what succeeded
          if [[ $EXIT -eq 2 ]]; then
              exit 0
          fi
          exit $EXIT

      # Gated on the game, because scraping for a game and serving it are
      # separate things: a target can be scheduled before its site exists,
      # and this step fails the job when the host does not answer - after
      # the scrape has already succeeded and the prices are in the bucket.
      # RELOAD_GAMES names the games whose site is ready to be told, so a
      # new game prices quietly until it is added. datastore-gen gates its
      # own reload on a variable of the same name for the same reason.
      #
      # The match is on whole words: a substring test would let "piece"
      # stand for "onepiece". Runs of whitespace collapse to one space
      # first, so a value typed one game per line reads the same as a
      # space-separated one. An unset variable names no game and so tells
      # no site, which is the safe way round - a run that published and
      # said nothing loses the reload, where a run that fails loses the
      # green tick on work that was done.
      - name: Ping server
        env:
          BAN_SECRET: "${{ secrets.BAN_SECRET }}"
          RELOAD_GAMES: "${{ vars.RELOAD_GAMES }}"
          GAME: "${{ inputs.game }}"
        run: |
          case " $(printf '%s' "${RELOAD_GAMES:-}" | tr -s '[:space:]' ' ') " in
          *" $GAME "*) ;;
          *)
            echo "$GAME is not in RELOAD_GAMES (${RELOAD_GAMES:-unset}); priced without asking the site to reload"
            exit 0
            ;;
          esac
          SIGNED_URL=$(bantool -sign http://$GAME.mtgban.com/api/load/${{ inputs.store }} 2> /dev/null)
          curl -L "$SIGNED_URL" 2> /dev/null | tee /dev/stderr | jq -e 'select(.status=="ok")'

      - name: Check bantool status
        if: ${{ steps.run_bantool.outputs.exit_code == '2' }}
        run: |
          echo "bantool returned exit code 2"
          exit 1
