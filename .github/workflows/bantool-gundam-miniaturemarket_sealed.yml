name: gundam / miniaturemarket_sealed

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [gundam-miniaturemarket_sealed, gundam-all]
  schedule:
    - cron: "23 3,15 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-miniaturemarket
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      store: miniaturemarket_sealed
      game: "gundam"
      affiliate: ${{ vars.MM_PARTNER }}
      datastore-filepath: b2://mtgban-datastore/gundam/gundam.json.xz
    secrets: inherit
