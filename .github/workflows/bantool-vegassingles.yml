name: magic / vegassingles

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [vegassingles]
  # AnonTCG: keep disabled until we decide cadence (and whether we consume
  # this vendor at all — the 'VS' source is not in price_sources).
  # schedule:
  #   - cron: "6 20 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-vegassingles
  cancel-in-progress: false
  queue: max

jobs:
  cache-datastore:
    uses: ./.github/workflows/cache-file.yml
    with:
      url: ${{ vars.DATASTORE_MAGIC }}
      path: "datastore/"
      game: "magic"
    secrets: inherit

  deploy:
    name: ${{ github.workflow }}
    needs: [cache-datastore]
    uses: ./.github/workflows/run-bantool.yml
    with:
      target: vegassingles
      game: "magic"
      datastore-filepath: ${{ needs.cache-datastore.outputs.filepath }}
      datastore-cache-key: ${{ needs.cache-datastore.outputs.key }}
    secrets: inherit
