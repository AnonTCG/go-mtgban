name: fleshandblood / miniaturemarket_sealed

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [fleshandblood-miniaturemarket_sealed, fleshandblood-all]
  schedule:
    - cron: "10 4,16 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-miniaturemarket
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      store: miniaturemarket_sealed
      game: "fleshandblood"
      affiliate: ${{ vars.MM_PARTNER }}
      datastore-filepath: b2://mtgban-datastore/fleshandblood/fleshandblood.json.xz
    secrets: inherit
