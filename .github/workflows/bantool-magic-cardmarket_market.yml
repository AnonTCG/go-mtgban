name: magic / cardmarket_market

# The full run measured 10h50 on the cardmarket-market runner. This slot
# follows the four shorter Market jobs already scheduled at 07:10, 08:25,
# 09:40 and 10:55 UTC; all five share the concurrency group below, so a
# slow run queues the next one instead of starting a second catalog walk;
# the later Pokemon and YuGiOh jobs use the same group too.
on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [magic-cardmarket_market, magic-all]
  schedule:
    - cron: "10 19 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-cardmarket
  cancel-in-progress: false
  queue: max

jobs:
  # No cache-datastore job on a self-hosted runner: actions/cache cannot
  # restore there an entry a GitHub-hosted job saved (a documented gap,
  # confirmed live twice against this key). The datastore is read over
  # HTTPS straight from DATASTORE_MAGIC, which simplecloud.Open reads
  # directly, and the id map straight from its bucket, as every game's is.
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      store: cardmarket_market
      game: "magic"
      affiliate: ${{ vars.MKM_PARTNER }}
      datastore-filepath: ${{ vars.DATASTORE_MAGIC }}
      cardmarket-catalog-filepath: b2://mtgban-datastore/magic/cardmarket_catalog.json.xz
      runs-on: '["self-hosted", "cardmarket-market"]'
    secrets: inherit
